<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top-Bottom Paper Trader</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="/static/theme.css">
<style>
  .pt { display:grid; grid-template-columns:320px minmax(0,1fr); gap:18px; align-items:start; }
  .pt form { display:grid; gap:10px; margin-bottom:18px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row2 input, .row2 select, .pt form input, .pt form select { width:100%; }
  .msg { font-size:12px; color:var(--danger); min-height:16px; }
  .pill { font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--bg-hover); color:var(--text-secondary); }
  .pill.on { background:var(--success-soft); color:var(--success); }
  .inst { border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:8px; cursor:pointer; background:var(--bg-surface); }
  .inst:hover { background:var(--bg-hover); } .inst.sel { border-color:var(--accent); background:var(--accent-soft); }
  .inst .top { display:flex; justify-content:space-between; align-items:center; font-weight:600; }
  .inst .sub { display:flex; justify-content:space-between; margin-top:4px; font-size:12px; color:var(--text-muted); }
  .x { background:none; border:0; color:var(--text-muted); font-size:16px; cursor:pointer; padding:0 4px; }
  .panel { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:18px; margin-bottom:18px; min-width:0; }
  .panel-head { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .panel-head .title { font-size:16px; font-weight:700; }
  .empty { color:var(--text-muted); padding:40px; text-align:center; }
  tr.replay td { color:var(--text-muted); }
  .stats { margin-bottom:18px; }
  @media (max-width: 980px) { .pt { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-logo">T</span>Top-Bottom</div>
    <nav class="nav">
      <a href="/" class="active">Paper Trader</a>
      <a href="/replay">Index Replay</a>
    </nav>
  </aside>
  <div class="content">
    <div class="topbar">
      <h1>Top-Bottom Paper Trader</h1>
      <span id="mkt" class="pill">Market</span>
      <span id="angel" class="pill">Angel One</span>
      <span class="spacer"></span>
      <span id="tick" class="pill">&mdash;</span>
      <button class="secondary-button" id="refresh">Refresh</button>
      <button class="icon-button" id="theme" title="Toggle light / dark" aria-label="Toggle theme">&#9790;</button>
    </div>
    <main class="page">
      <div class="pt">
        <aside class="card">
          <h2 style="margin-bottom:12px">Add instrument</h2>
          <form id="add">
            <label>Symbol<input name="symbol" placeholder="RELIANCE, BANKNIFTY..." required></label>
            <div class="row2">
              <label>Type<select name="instrument_type"><option value="EQUITY">Equity</option><option value="FUTURE">Future (near month)</option></select></label>
              <label>Timeframe<select name="timeframe" id="tf"></select></label>
            </div>
            <div class="row2">
              <label><span id="sizeLabel">Shares</span><input name="size" type="number" min="1" value="1" required></label>
              <label>Replay days<input name="lookback_days" type="number" min="1" id="lookback"></label>
            </div>
            <button class="primary-button" id="addBtn" style="justify-content:center">Start paper trading</button>
            <div class="msg" id="addMsg"></div>
          </form>
          <h2 style="margin-bottom:10px">Watchlist</h2>
          <div id="list"></div>
        </aside>
        <div>
          <div class="stats" id="totals"></div>
          <div id="detail"><div class="empty">Add an instrument to start paper trading.</div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const money = (v) => v == null ? "—" : (v < 0 ? "-" : "") + "₹" + Math.abs(v).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const num = (v) => v == null ? "—" : v.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cls = (v) => v > 0 ? "pos" : v < 0 ? "neg" : "";
let selected = localStorage.getItem("sel"), chart, candleS, sysS, stopS, chartFor = null, defaults = {};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

function card(k, v, c = "") { return `<div class="stat ${c === "pos" ? "good" : c === "neg" ? "bad" : ""}"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`; }

async function loadOverview() {
  const o = await api("/api/overview");
  $("#mkt").textContent = o.market_open ? "Market open" : "Market closed";
  $("#mkt").classList.toggle("on", o.market_open);
  $("#angel").textContent = o.angelone_configured ? "Angel One configured" : "Angel One NOT configured";
  $("#angel").classList.toggle("on", o.angelone_configured);
  $("#tick").textContent = o.last_tick ? "Updated " + o.last_tick.slice(11) : "Waiting for first update";
  if (!$("#tf").options.length) {
    defaults = o.default_lookback_days;
    $("#tf").innerHTML = o.timeframes.map((t) => `<option ${t === "15m" ? "selected" : ""}>${t}</option>`).join("");
    $("#lookback").value = defaults["15m"];
  }
  const t = o.totals;
  $("#totals").innerHTML =
    card("Live realized P&L", money(t.live_realized), cls(t.live_realized)) +
    card("Unrealized P&L", money(t.unrealized), cls(t.unrealized)) +
    card("Live closed trades", t.live_trades) +
    card("Live win rate", t.live_win_rate == null ? "—" : t.live_win_rate + "%") +
    card("Open positions", t.open_positions);
  if (!o.items.some((i) => i.instrument.id === selected)) selected = o.items[0]?.instrument.id ?? null;
  $("#list").innerHTML = o.items.map((i) => {
    const p = i.position, dir = p ? p.direction : "FLAT", inst = i.instrument;
    return `<div class="inst ${inst.id === selected ? "sel" : ""}" data-id="${inst.id}">
      <div class="top"><span>${esc(inst.symbol)} <span style="color:var(--text-muted);font-weight:400">${inst.timeframe}</span></span>
        <span><span class="badge ${dir}">${dir}</span><button class="x" data-del="${inst.id}" title="Remove">×</button></span></div>
      <div class="sub"><span>${esc(inst.trading_symbol)} × ${inst.quantity}</span>
        <span>${i.error ? `<span class="neg">error</span>` : num(i.ltp)}</span></div>
      ${i.error ? `<div class="sub neg">${esc(i.error)}</div>` : p ? `<div class="sub"><span>Open P&L</span><span class="${cls(p.pnl_amount)}">${money(p.pnl_amount)}</span></div>` : ""}
    </div>`;
  }).join("") || `<div class="empty" style="padding:16px">Nothing yet.</div>`;
  return o;
}

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function ensureChart() {
  if (chart) return;
  const c = { bg: css("--bg-surface"), text: css("--text-secondary"), grid: css("--border"), accent: css("--accent"), up: css("--success"), down: css("--danger") };
  chart = LightweightCharts.createChart($("#chart"), {
    autoSize: true,
    layout: { background: { color: c.bg }, textColor: c.text, fontFamily: css("--font-sans") },
    grid: { vertLines: { color: c.grid }, horzLines: { color: c.grid } },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: c.grid },
    rightPriceScale: { borderColor: c.grid },
    crosshair: { mode: 0 },
  });
  candleS = chart.addLineSeries({ color: c.accent, lineWidth: 2, lastValueVisible: true, priceLineVisible: true, priceLineStyle: 2 });   // close-price line
  const step = { lineType: 1, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };
  sysS = chart.addLineSeries({ ...step, color: c.up });
  stopS = chart.addLineSeries({ ...step, color: c.down });
}
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const dark = (t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  $("#theme").textContent = dark ? "\u2600" : "\u263E";
}
try { applyTheme(localStorage.getItem("theme")); } catch (e) { applyTheme(null); }
$("#theme").onclick = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  try { localStorage.setItem("theme", next); } catch (e) { /* ignore */ }
  applyTheme(next);
  if (chart) { chart.remove(); chart = null; chartFor = null; loadDetail(); }
};

async function loadDetail() {
  if (!selected) { $("#detail").innerHTML = `<div class="empty">Add an instrument to start paper trading.</div>`; chart = null; chartFor = null; return; }
  let s;
  try { s = await api("/api/instruments/" + selected); }
  catch (e) { $("#detail").innerHTML = `<div class="panel neg">${esc(e.message)}</div>`; chart = null; chartFor = null; return; }
  const inst = s.instrument, p = s.position, st = s.stats;
  if (chartFor !== selected) {
    $("#detail").innerHTML = `
      <div class="panel"><div class="panel-head"><span class="title" id="dTitle"></span><span id="dBadge"></span><span class="spacer"></span>
        <div class="legend"><span><i style="background:var(--accent)"></i>Close</span><span><i style="background:var(--success)"></i>System point</span><span><i style="background:var(--danger)"></i>Trailing stop</span><span>▲▼ entries</span></div></div>
        <div id="chart"></div></div>
      <div class="stats" id="dCards"></div>
      <div class="panel"><h2>Trades</h2><div class="scroll"><table><thead><tr>
        <th>#</th><th>Side</th><th>Entry time</th><th>Entry</th><th>Trigger close</th><th>Stop</th><th>Exit time</th><th>Exit</th><th>Points</th><th>P&L</th><th>%</th><th>Status</th>
      </tr></thead><tbody id="dTrades"></tbody></table></div>
      <div style="color:var(--text-muted);font-size:12px;margin-top:8px">Greyed rows are replay trades from before you added this instrument — not counted in live P&L.</div></div>`;
    chart = null; ensureChart();
  }
  $("#dTitle").textContent = `${inst.trading_symbol} · ${inst.timeframe} · qty ${inst.quantity}`;
  $("#dBadge").innerHTML = `<span class="badge ${p ? p.direction : "FLAT"}">${p ? p.direction : "FLAT"}</span>`;
  candleS.setData(s.candles.map((k) => ({ time: k.time, value: k.close }))); sysS.setData(s.system_line); stopS.setData(s.stop_line);
  candleS.setMarkers(s.markers);
  if (chartFor !== selected) { chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, s.candles.length - 180), to: s.candles.length + 5 }); chartFor = selected; }
  $("#dCards").innerHTML =
    card("Last price", num(s.ltp)) +
    card("Position", p ? `${p.direction} @ ${num(p.entry_price)}` : (s.waiting ? "Flat · waiting for a new System Point" : "Flat"), p ? (p.direction === "BUY" ? "pos" : "neg") : "") +
    card("Active stop", p ? num(p.active_stop) : "—") +
    card("Open P&L", p ? money(p.pnl_amount) : "—", p ? cls(p.pnl_amount) : "") +
    card("Latest top", num(s.latest_top)) + card("Latest bottom", num(s.latest_bottom)) +
    card("Live realized", money(st.live_realized), cls(st.live_realized)) +
    card("Live trades / win", `${st.live_trades} / ${st.live_win_rate == null ? "—" : st.live_win_rate + "%"}`) +
    card("Replay realized", money(st.replay_realized), cls(st.replay_realized)) +
    card("Last closed bar", s.last_confirmed_bar.slice(5));
  $("#dTrades").innerHTML = s.trades.map((t) => `<tr class="${t.live ? "" : "replay"}">
    <td>${t.n}</td><td><span class="badge ${t.direction}">${t.direction}</span></td><td>${t.entry_date}</td>
    <td>${num(t.entry_price)}</td><td>${num(t.trigger_close)}</td><td>${num(t.active_stop)}</td>
    <td>${t.exit_date ?? "—"}</td><td>${num(t.exit_price)}</td>
    <td class="${cls(t.pnl_points)}">${num(t.pnl_points)}</td><td class="${cls(t.pnl_amount)}">${money(t.pnl_amount)}</td>
    <td class="${cls(t.pnl_pct)}">${t.pnl_pct}%</td><td>${t.status}${t.live ? "" : " · replay"}${t.breakeven ? " · 2% PROFIT → BREAKEVEN SL" : ""}${t.gap_state ? " · " + t.gap_state : ""}</td></tr>`).join("")
    || `<tr><td colspan="12" class="empty">No trades yet.</td></tr>`;
}

async function loadAll() { try { await loadOverview(); await loadDetail(); } catch (e) { $("#tick").textContent = "Backend unreachable"; } }

$("#list").addEventListener("click", async (e) => {
  const del = e.target.dataset.del;
  if (del) { if (confirm("Remove this instrument from paper trading?")) { await api("/api/instruments/" + del, { method: "DELETE" }); loadAll(); } return; }
  const el = e.target.closest(".inst");
  if (el) { selected = el.dataset.id; localStorage.setItem("sel", selected); loadAll(); }
});
$("#tf").addEventListener("change", (e) => { $("#lookback").value = defaults[e.target.value] ?? ""; });
$("#add").instrument_type.addEventListener("change", (e) => { $("#sizeLabel").textContent = e.target.value === "FUTURE" ? "Lots" : "Shares"; });
$("#add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target), body = Object.fromEntries(f);
  body.size = +body.size; body.lookback_days = body.lookback_days ? +body.lookback_days : null;
  $("#addBtn").disabled = true; $("#addMsg").textContent = "";
  try {
    const r = await api("/api/instruments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    selected = r.instrument.id; localStorage.setItem("sel", selected); e.target.symbol.value = "";
    if (r.error) $("#addMsg").textContent = r.error;
  } catch (err) { $("#addMsg").textContent = err.message; }
  $("#addBtn").disabled = false; loadAll();
});
$("#refresh").addEventListener("click", async () => { $("#refresh").disabled = true; try { await api("/api/refresh", { method: "POST" }); } catch (e) {} $("#refresh").disabled = false; loadAll(); });
loadAll(); setInterval(loadAll, 15000);
</script>
</body>
</html>
