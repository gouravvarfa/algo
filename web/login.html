<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Algo Trading</title>
<script src="/static/shell.js?v=20261027"></script>
<link rel="stylesheet" href="/static/theme.css?v=20261027">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .box { width: min(380px, calc(100vw - 32px)); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-md); padding: 28px; display: grid; gap: 14px; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; }
  .logo i { display: inline-flex; align-items: flex-end; gap: 2px; height: 20px; } .logo i b { width: 4px; background: var(--accent); border-radius: 1px; }
  input { width: 100%; height: 40px; } button { justify-content: center; height: 42px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <div class="logo"><i><b style="height:8px"></b><b style="height:13px"></b><b style="height:20px"></b><b style="height:16px"></b></i>Algo Trading</div>
  <div class="sub" style="margin:0">Sign in. Paper trading and research only, no broker orders.</div>
  <label>Username <input name="username" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err"></div>
  <button class="primary-button" type="submit">Sign in</button>
</form>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('err').textContent = q.get('e') === 'wait' ? 'Too many attempts. Try again in 15 minutes.' : q.get('e') ? 'Wrong username or password.' : '';
</script>
</body>
</html>
