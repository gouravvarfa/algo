# Compression for the pages and data the app sends (nginx's own gzip is "on" in the default nginx.conf, but gzip_types is commented out there,
# so JavaScript, CSS and JSON were sent as they are: the main script alone was 239 KB, about 76 KB compressed).
# Install: sudo cp deploy/nginx-gzip.conf /etc/nginx/conf.d/algo-gzip.conf && sudo nginx -t && sudo systemctl reload nginx
# Remove:  sudo rm /etc/nginx/conf.d/algo-gzip.conf && sudo systemctl reload nginx
# text/event-stream (the live price stream) is deliberately NOT in the list: a stream must never be buffered for compression. Fonts (woff2) are already compressed.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
